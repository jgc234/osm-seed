name: Build Containers

on:
  push:
    paths:
      - 'images/**'
      - 'Dockerfile*'
      - '.github/workflows/build_and_push.yaml'
      
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
      
jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds, optional)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5

      - name: build osm-processor
        uses: docker/build-push-action@v6
        with:
          context: ./images/osm-processor/
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/osmseed-osm-processor:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: build populate-apidb
        uses: docker/build-push-action@v6
        with:
          context: ./images/populate-apidb/
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/osmseed-populate-apidb:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: build db
        uses: docker/build-push-action@v6
        with:
          context: ./images/db/
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/osmseed-db:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: ./images/web/
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/osmseed-web:latest
          labels: ${{ steps.meta.outputs.labels }}
